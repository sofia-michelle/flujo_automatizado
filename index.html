<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Solicitud de Recuperatorio</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="contenedor">

        <h1>Sistema de Solicitud de Recuperatorio</h1>

        <p class="descripcion">
            Complete los siguientes datos para solicitar la inscripción a una mesa de recuperatorio.
            El sistema verificará automáticamente si el alumno cumple las condiciones para realizar la inscripción.
        </p>

        <form id="formulario">

            <label for="nombre">Nombre y Apellido</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingrese nombre y apellido"
                required>

            <label for="dni">DNI</label>
            <input
                type="text"
                id="dni"
                name="dni"
                placeholder="Ingrese DNI"
                required>

            <label for="materia">Materia</label>
            <select
                id="materia"
                name="materia"
                required>

                <option value="">Seleccione una materia</option>
                <option value="Programacion">Programación</option>
                <option value="Base de Datos">Base de Datos</option>
                <option value="Redes">Redes</option>

            </select>

            <button type="submit">
                Solicitar Recuperatorio
            </button>

        </form>

        <div id="resultado"></div>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
